name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpypi-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cyberchef-py/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - name: Fail if this version already exists on the index
        run: |
          version="$(uv version --short)"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://test.pypi.org/pypi/cyberchef-py/${version}/json")"
          if [ "$status" = "200" ]; then
            echo "cyberchef-py ${version} already exists on test.pypi.org; bump the version." >&2
            exit 1
          fi
      - name: Install project
        run: uv sync --locked --dev
      - name: Run release tests
        run: uv run pytest
      - name: Build distributions
        run: uv build --no-sources --clear
      - name: Validate distributions
        run: |
          uv run twine check --strict dist/*
          uv run check-wheel-contents dist/*.whl
          uv run --isolated --no-project --with dist/*.whl python tests/smoke_test.py
          uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke_test.py
          uv run python tests/check_wheel_typing.py dist/*.whl
      - name: Verify artifact versions match the package version
        run: |
          version="$(uv version --short)"
          test -f "dist/cyberchef_py-${version}-py3-none-any.whl"
          test -f "dist/cyberchef_py-${version}.tar.gz"
          test "$(ls dist | wc -l)" -eq 2
      - name: Publish with Trusted Publishing
        run: uv publish --index testpypi --trusted-publishing always
