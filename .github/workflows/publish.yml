name: Publish to PyPI

on:
  # Pushing a final-release tag (vMAJOR.MINOR.PATCH) publishes. Pre-release tags such as
  # v0.3.0rc1 do not match. The `pypi` environment can still require a manual approval.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cyberchef-py/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - name: Verify tag and package version
        run: test "v$(uv version --short)" = "${{ github.ref_name }}"
      - name: Fail if this version already exists on the index
        run: |
          version="$(uv version --short)"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cyberchef-py/${version}/json")"
          if [ "$status" = "200" ]; then
            echo "cyberchef-py ${version} already exists on pypi.org; bump the version." >&2
            exit 1
          fi
      - name: Install project
        run: uv sync --locked --dev
      - name: Run release tests
        run: uv run pytest
      - name: Build distributions
        run: uv build --no-sources --clear
      - name: Validate distributions
        run: |
          uv run twine check --strict dist/*
          uv run check-wheel-contents dist/*.whl
          uv run --isolated --no-project --with dist/*.whl python tests/smoke_test.py
          uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke_test.py
          uv run python tests/check_wheel_typing.py dist/*.whl
      - name: Verify artifact versions match the tag
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          test -f "dist/cyberchef_py-${version}-py3-none-any.whl"
          test -f "dist/cyberchef_py-${version}.tar.gz"
          test "$(ls dist | wc -l)" -eq 2
      - name: Publish with Trusted Publishing
        run: uv publish --trusted-publishing always
