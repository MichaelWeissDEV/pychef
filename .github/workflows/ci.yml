name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install project
        run: uv sync --locked --dev
      - name: Run tests
        run: uv run pytest

  quality:
    name: Quality and distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - name: Install project
        run: uv sync --locked --dev
      - name: Check lock file
        run: uv lock --check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Validate project metadata
        run: uv run validate-pyproject pyproject.toml
      - name: Build distributions
        run: uv build --no-sources --clear
      - name: Check package metadata
        run: uv run twine check --strict dist/*
      - name: Check wheel contents
        run: uv run check-wheel-contents dist/*.whl
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl python tests/smoke_test.py
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke_test.py
