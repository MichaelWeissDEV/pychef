[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cyberchef-py"
version = "0.2.0"
description = "Unofficial pure-Python CyberChef-compatible recipes, pipelines, and CTF tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Michael Weiss" }]
keywords = ["cyberchef", "ctf", "pcap", "encoding", "cryptography", "data-transformation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MichaelWeissDEV/pychef"
Documentation = "https://cyberchef-py.readthedocs.io/en/latest/"
Source = "https://github.com/MichaelWeissDEV/pychef"
Issues = "https://github.com/MichaelWeissDEV/pychef/issues"
Changelog = "https://github.com/MichaelWeissDEV/pychef/blob/main/CHANGELOG.md"
Upstream = "https://github.com/gchq/CyberChef"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "check-wheel-contents>=0.6",
  "twine>=6.2",
  "ty>=0.0.1a16",
  "validate-pyproject>=0.24",
]
docs = [
  "sphinx>=7.4,<9",
  "sphinx-copybutton>=0.5,<1",
  "sphinx-rtd-theme>=3,<4",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/pychef"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/COMPATIBILITY.md",
  "/CONTRIBUTING.md",
  "/.readthedocs.yaml",
  "/docs",
  "/examples",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/THIRD_PARTY_LICENSES.md",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=pychef --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pychef"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.10"
